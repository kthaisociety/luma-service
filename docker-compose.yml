# Local Postgres only. Bound to 127.0.0.1: a dev machine with a public IP would otherwise expose it.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: luma
      POSTGRES_USER: luma
      POSTGRES_PASSWORD: luma
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
